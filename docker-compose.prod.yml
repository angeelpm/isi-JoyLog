services:
  mongodb:
    image: mongo:latest
    container_name: joylog_mongo
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    networks:
      - joylog-net

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: joylog_auth_service
    restart: unless-stopped
    environment:
      - PORT=3001
      - MONGODB_URI=mongodb://mongodb:27017/joylog
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - mongodb
    networks:
      - joylog-net

  library-service:
    build:
      context: .
      dockerfile: services/library-service/Dockerfile
    container_name: joylog_library_service
    restart: unless-stopped
    environment:
      - PORT=3002
      - MONGODB_URI=mongodb://mongodb:27017/joylog
      - JWT_SECRET=${JWT_SECRET}
      - ITAD_API_KEY=${ITAD_API_KEY}
    depends_on:
      - mongodb
    networks:
      - joylog-net

  ai-service:
    build:
      context: .
      dockerfile: services/ai-service/Dockerfile
    container_name: joylog_ai_service
    restart: unless-stopped
    environment:
      - PORT=3003
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    networks:
      - joylog-net

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: joylog_api_gateway
    restart: unless-stopped
    environment:
      - PORT=3000
      - RAWG_API_KEY=${RAWG_API_KEY}
    depends_on:
      - auth-service
      - library-service
      - ai-service
    networks:
      - joylog-net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: joylog_frontend
    restart: unless-stopped
    depends_on:
      - api-gateway
    networks:
      - joylog-net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: joylog_cloudflared
    restart: unless-stopped
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflare:/etc/cloudflared:ro
    depends_on:
      - frontend
    networks:
      - joylog-net

volumes:
  mongodb_data:

networks:
  joylog-net:
    driver: bridge
